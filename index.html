<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>PRECISION / v0.1</title></head><body><main id="app"><header><span>PRECISION <small>1st</small></span><output id="timer">90.0</output><button id="settings">練習</button></header><div id="game" aria-label="ゲーム画面"></div><div id="notice"><h1>PRECISION</h1><p id="message">白い丸を、ゴールまで。<br>壁に触れたら即リトライ。</p><button id="start">スタート</button><p class="hint">下のスティックで移動<br>PC：矢印 / WASD・Shiftで低速</p></div><button id="skipPreview" hidden>プレビューをスキップ</button><div id="status" aria-live="polite">準備完了</div><footer><div id="stick" role="slider" aria-label="移動スティック" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="knob"></div></div><span>ゆっくり倒して精密操作</span><button id="retry">↻ リトライ</button></footer></main><dialog id="panel"><form id="options"><h2>ステージ・練習設定</h2><label>ステージ<select id="stageId"><option value="first">1st</option><option value="second">2nd</option><option value="third">3rd</option><option value="prototype">v0.1 試験コース</option></select></label><label>モード<select id="mode"><option value="normal">通常</option><option value="practice">練習</option></select></label><label>開始地点<select id="checkpoint"><option value="start">スタート</option><option value="crank">クランク入口</option><option value="windmill">風車入口</option><option value="press">プレス入口</option></select></label><label class="check"><input type="checkbox" id="timed" checked>タイマー有効</label><label>プレイヤー半径<input id="playerRadius" type="number" min="3" max="10" value="6"></label><label>コース基準通路幅<input id="corridorWidth" type="number" min="36" max="52" step="4" value="44"></label><label>制限時間（秒）<input id="limit" type="number" min="1" max="600" value="90"></label><div id="developer" hidden><h2>開発者設定</h2><label class="check"><input type="checkbox" id="custom">任意座標を使用</label><div class="pair"><label>X<input id="spawnX" type="number" value="200" min="0" max="3512"></label><label>Y<input id="spawnY" type="number" value="1550" min="0" max="1700"></label></div><label class="check"><input type="checkbox" id="invincible">無敵</label><label class="check"><input type="checkbox" id="hitboxes">判定表示</label><label class="check"><input type="checkbox" id="freeze">タイマー停止（障害物は動作）</label><label>ステージ経過時間（秒）<input id="elapsed" type="number" min="0" max="3600" step="0.1" value="0"></label><label>障害物速度倍率<input id="obstacleSpeed" type="number" min="0" max="4" step="0.1" value="1"></label><label>移動速度倍率<input id="playerSpeed" type="number" min="0.1" max="4" step="0.1" value="1"></label><label>最高速度<input id="maxSpeed" type="number" min="10" max="500" value="125"></label><label>最低速度<input id="minSpeed" type="number" min="0" max="50" value="2"></label><label>デッドゾーン<input id="deadZone" type="number" min="0" max="0.5" step="0.01" value="0.08"></label><label>速度カーブ<input id="curve" type="number" min="1" max="4" step="0.1" value="1.8"></label></div><p class="hint">適用すると選択地点から待機状態に戻る。<br>開発者設定：URL末尾に ?dev=1</p><div class="pair"><button type="button" id="close">閉じる</button><button type="submit">適用</button></div></form></dialog><script type="module" src="/src/main.ts"></script></body></html>
